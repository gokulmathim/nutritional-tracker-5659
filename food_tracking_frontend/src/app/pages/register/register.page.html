<div class="auth-page">
  <div class="card">
    <h2>Create your account</h2>
    <p class="muted">Start tracking meals and nutrition.</p>

    <form [formGroup]="form" (ngSubmit)="submit()">
      <label>Name (optional)</label>
      <input type="text" formControlName="name" placeholder="Your name" />

      <label>Email</label>
      <input type="email" formControlName="email" placeholder="you@example.com" />

      <label>Password</label>
      <input type="password" formControlName="password" placeholder="••••••••" />

      <button class="btn" type="submit" [disabled]="form.invalid">Create Account</button>

      <div class="error" *ngIf="error">{{ error }}</div>
    </form>

    <p class="switch">Already have an account? <a routerLink="/login">Sign in</a></p>
  </div>
</div>
